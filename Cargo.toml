[workspace]
resolver = "3"
members = [
    "crates/threads-archive",
    "services/threads-archive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97" # equals the pinned toolchain; no MSRV promise we cannot check
license = "BSD-3-Clause"
repository = "https://github.com/po4yka/ratatoskr-threads"

[workspace.dependencies]
ratatoskr-threads-archive           = { version = "=0.1.0", path = "crates/threads-archive" }

# ---- cross-repository contracts ----
# The social-source and event-envelope wire contracts are pinned to the accepted
# producer/Knowledge boundary revision. The full revision, rather than the
# transport URL, is the compatibility guarantee until registry publication.
ratatoskr-social-contracts    = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "f0dc35f" }
ratatoskr-event-envelope      = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "f0dc35f" }
ratatoskr-identifiers         = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "f0dc35f" }
ratatoskr-operation-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "f0dc35f" }

# ---- async runtime and HTTP ----
tokio      = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
axum       = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
async-nats    = "=0.50.0"
futures-util = "=0.3.34"
tower      = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
reqwest    = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# ---- persistence ----
# No `migrate` feature: the schema is one file, `include_str!`d into the binary by
# `ratatoskr-threads-archive`, so a deployment cannot drift from its schema and there is no
# ledger to record.
sqlx = { version = "=0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
] }

# ---- configuration and secrets ----
secrecy = "=0.10.3"
# Fleet OAuth envelope: AES-256-GCM with explicit key generation and fresh nonces.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "=0.4.3"

# ---- telemetry ----
tracing                     = "=0.1.44"
tracing-subscriber          = { version = "=0.3.23", default-features = false, features = ["std", "registry", "env-filter", "fmt", "json"] }
metrics                     = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }

# ---- time ----
# `clock` + `std` only: `timestamptz` maps to `DateTime<Utc>` through sqlx's
# `chrono` feature; later OAuth expiry work reuses the same mapping.
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

# ---- identifiers ----
# `v7` because ratatoskr-contracts mints UUIDv7 for internally minted identity, and the database
# stores the same bytes; schema.sql deliberately carries no id DEFAULT that could produce v4.
uuid = { version = "=1.24.1", features = ["v5", "v7"] }

# ---- serialization and errors ----
serde      = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror  = "=2.0.20"
sha2       = "=0.10.9"
zip        = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro          = "deny"
todo               = "deny"
print_stdout       = "deny"     # startup failures go to stderr; a stray println bypasses the subscriber
# `panic`, `unwrap_used` and `expect_used` above close every EXPLICIT panic path and leave the most
# common implicit ones open. Both of these are `allow` by default and in `clippy::restriction`, so
# `pedantic` does not enable them. Adopted at zero violations in a fresh tree.
indexing_slicing   = "deny"     # `v[i]` and `&s[a..b]` panicking out of bounds
string_slice       = "deny"     # `&s[..n]` panicking because n is not a UTF-8 char boundary

# Release keeps the default `unwind` panic strategy ON PURPOSE: `panic = "abort"` silently disables
# catch-unwind-based error responses.
[profile.release]
debug = 1 # line tables only: a usable backtrace in the ERROR log, no full debuginfo
